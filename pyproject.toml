[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs==0.5",
  "hatchling==1.31",
]

[project]
name = "target-firebase"
description = "Singer target for Firebase, built with the Meltano Singer SDK."
readme = "README.md"
keywords = [
  "ELT",
  "Firebase",
]
license = "Apache-2.0"
requires-python = ">=3.12"
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
  "firebase-admin~=7.5.0",
  "singer-sdk[faker]~=0.55.0a1",
]
[[project.authors]]
name = "Edgar Ramírez-Mondragón"
email = "edgarrm358@gmail.com"
[project.optional-dependencies]
s3 = [ "s3fs>=2026.3" ]
[project.scripts]
target-firebase = "target_firebase.target:TargetFirebase.cli"

[dependency-groups]
dev = [
  "deptry>=0.25",
  { include-group = "testing" },
  { include-group = "typing" },
]
testing = [
  "pytest>=9",
  "singer-sdk[testing]",
]
typing = [
  "mypy>=2.1",
  "ty>=0.0.50",
  { include-group = "testing" },
]

[tool.hatch.version]
fallback-version = "0.1.0.dev0"
source = "vcs"

[tool.ruff]
required-version = ">=0.16"
line-length = 100
preview = true
[tool.ruff.lint]
ignore = [
  "missing-trailing-comma",
]
select = [ "ALL" ]
[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.deptry.package_module_name_map]
s3fs = "s3fs"
[tool.deptry.per_rule_ignores]
DEP002 = [ "s3fs" ]

[tool.pyproject-fmt]
table_format = "long"

[tool.mypy]
follow_untyped_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_unreachable = true
enable_error_code = [
  "exhaustive-match",
  "ignore-without-code",
  "redundant-expr",
  "truthy-bool",
]
strict = true
warn_unused_configs = true

[tool.pytest]
addopts = [ "-v", "-ra" ]
filterwarnings = [
  "error",
]
log_level = "INFO"
minversion = "9"
strict = true
testpaths = [ "tests" ]

[tool.tox]
requires = [
  "tox>=4.53",
  "tox-uv>=1.35",
]
env_list = [
  "dependencies",
  "typing",
  { prefix = "3.", start = 12 },
]
[tool.tox.env.dependencies]
description = "check for unused, missing and transitive dependencies"
dependency_groups = [ "dev" ]
commands = [ [ "deptry", "." ] ]
labels = [ "check" ]
[tool.tox.env.typing]
description = "type checks"
dependency_groups = [ "typing" ]
commands = [
  [ "mypy", "target_firebase", "tests" ],
  [ "ty", "check", "target_firebase", "tests" ],
]
labels = [ "check" ]
[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
description = "run tests on Python {py_dot_ver}"
dependency_groups = [ "dev" ]
pass_env = [ "TARGET_FIREBASE_*" ]
commands = [ [ "pytest", { replace = "posargs", default = [ "tests" ], extend = true } ] ]
