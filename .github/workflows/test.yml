name: Test target-firebase

on:
  push:
    branches: [main]
    paths:
    - .github/workflows/test.yml
    - target_firebase/**
    - tests/**
    - pyproject.toml
    - tox.ini
    - uv.lock
  pull_request:
    branches: [main]
    paths:
    - .github/workflows/test.yml
    - target_firebase/**
    - tests/**
    - pyproject.toml
    - tox.ini
    - uv.lock
  workflow_dispatch:

env:
  FORCE_COLOR: 1

jobs:
  pytest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version:
        - "3.14"
        - "3.13"
        - "3.12"
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - run: pipx install tox
    - name: Run Tox
      env:
        TARGET_FIREBASE_CREDENTIAL: ${{ secrets.TARGET_FIREBASE_CREDENTIAL }}
      run: |
        tox -e $(echo py${{ matrix.python-version }} | tr -d .)
